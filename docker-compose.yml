name: gc-spring-petclinic

services:
  backend:
    profiles:
      - graft
    build:
      context: .
    ports:
      - "8090:80"
      - "8091:81"

  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: petclinic
      POSTGRES_PASSWORD: petclinic
      POSTGRES_DB: petclinic
    ports:
      - "5432:5432"
